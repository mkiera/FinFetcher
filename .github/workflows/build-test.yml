name: Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend build dependencies
        run: npm ci

      - name: Prepare alpha version
        id: version
        run: node scripts/build-identity.mjs --alpha --run-number ${{ github.run_number }}

      - name: Run frontend and release tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Stage frontend assets
        run: npm run build:frontend

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            $globs = @("$([Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Verify installer migration and rollback
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1 -Compiler "$env:ISCC"
          ./scripts/test-uninstaller.ps1 -Compiler "$env:ISCC"

      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Prepared -SkipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinFetcher-Setup
          path: dist_installer/FinFetcher-Setup.exe
          retention-days: 30
          if-no-files-found: error
