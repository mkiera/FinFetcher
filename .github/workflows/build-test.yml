name: Build Test

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build name suffix (e.g., streaming-test)'
        required: false
        default: 'test'
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # From requirements.txt so the build can't drift from what the app
          # imports — certifi in particular is NOT pulled in by plain yt-dlp
          # (it sits behind that project's "default" extra).
          pip install -r requirements.txt pyinstaller

      - name: Verify certifi is present for bundling
        run: python -c "import certifi, os; p = certifi.where(); assert os.path.exists(p), p; print('certifi OK:', p)"
      
      - name: Get build name
        id: build_name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "NAME=${{ github.event.inputs.build_name }}" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            BRANCH_NAME=${BRANCH_NAME#feature/}
            BRANCH_NAME=${BRANCH_NAME#bugfix/}
            echo "NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate version resource
        run: python make_version_info.py version_info.txt

      # Kept identical to the release build, so a test artifact is scored the
      # same way by antivirus as the thing that eventually ships.
      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --noupx --version-file version_info.txt --name "FinFetcher" --icon icon.ico --add-data "index.html;." --add-data "style.css;." --add-data "script.js;." --add-data "version.txt;." --add-data "icon.ico;." --clean --noconfirm main.pyw
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinFetcher_${{ steps.build_name.outputs.NAME }}
          path: dist/FinFetcher.exe
          retention-days: 30
