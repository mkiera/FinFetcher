name: Build and Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to package'
        required: true
        default: 'beta'
        type: string
      tag:
        description: 'Future release tag to validate and package without publishing'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            python prepare_version.py release --tag "$env:RELEASE_TAG" --validate-placement
          } else {
            python prepare_version.py release --tag "$env:RELEASE_TAG"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Verify certifi is present for bundling
        run: python -c "import certifi, os; p = certifi.where(); assert os.path.exists(p), p; print('certifi OK:', p)"

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Stamp the build with its commit and run
        run: python make_build_info.py build_info.json

      - name: Generate version resource
        env:
          FINFETCHER_BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: python make_version_info.py version_info.txt

      - name: Build app folder
        run: |
          python -m PyInstaller --onedir --windowed --noupx --version-file version_info.txt --name "FinFetcher" --icon icon.ico --add-data "index.html;." --add-data "style.css;." --add-data "script.js;." --add-data "build/version/version.txt;." --add-data "build_info.json;." --add-data "icon.ico;." --add-data "fonts;fonts" --clean --noconfirm main.pyw

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            $globs = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner - installing it."
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe still not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DVersionNumeric=${{ steps.version.outputs.VERNUM }}" "/DAppVersion=${{ steps.version.outputs.VERSION }}" installer.iss

      - name: Verify packaged versions
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $bundledVersion = (Get-Content -LiteralPath 'dist/FinFetcher/_internal/version.txt' -Raw).Trim()
          if ($bundledVersion -ne $env:BUILD_VERSION) { throw "Bundled version mismatch: $bundledVersion" }
          foreach ($package in @('dist/FinFetcher/FinFetcher.exe', 'dist_installer/FinFetcher-Setup.exe')) {
            $productVersion = (Get-Item -LiteralPath $package).VersionInfo.ProductVersion.Trim()
            if ($productVersion -ne $env:BUILD_VERSION) { throw "Version mismatch in ${package}: $productVersion" }
          }

      - name: Build legacy single-file exe
        # Clients through 1.2.4 replace their executable with the first release .exe asset.
        run: |
          python -m PyInstaller --onefile --windowed --noupx --version-file version_info.txt --name "FinFetcher" --distpath dist_legacy --workpath build_legacy --icon icon.ico --add-data "index.html;." --add-data "style.css;." --add-data "script.js;." --add-data "build/version/version.txt;." --add-data "build_info.json;." --add-data "icon.ico;." --add-data "fonts;fonts" --clean --noconfirm main.pyw

      - name: Verify release packages
        shell: pwsh
        run: |
          foreach ($package in @('dist_installer/FinFetcher-Setup.exe', 'dist_legacy/FinFetcher.exe')) {
            if (-not (Test-Path -LiteralPath $package)) { throw "Missing release package: $package" }
          }

      - name: Create Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          body_path: build/release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_BETA == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the legacy exe (sorts first, so older clients take it)
        if: github.event_name == 'push'
        run: |
          mv dist_legacy/FinFetcher.exe dist_legacy/FinFetcher-Legacy.exe
          gh release upload "${{ github.ref_name }}" "dist_legacy/FinFetcher-Legacy.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer
        if: github.event_name == 'push'
        run: gh release upload "${{ github.ref_name }}" "dist_installer/FinFetcher-Setup.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm asset order
        # Legacy sorts before Setup so portable clients download an application executable.
        if: github.event_name == 'push'
        shell: bash
        run: |
          FIRST=$(gh release view "${{ github.ref_name }}" --json assets --jq '[.assets[].name | select(endswith(".exe"))] | .[0]')
          echo "first .exe asset: $FIRST"
          test "$FIRST" = "FinFetcher-Legacy.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save dry-run packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FinFetcher-Release-Validation
          path: |
            dist_installer/FinFetcher-Setup.exe
            dist_legacy/FinFetcher.exe
          if-no-files-found: error
          retention-days: 7
