name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # From requirements.txt so the build can't drift from what the app
          # imports — certifi in particular is NOT pulled in by plain yt-dlp
          # (it sits behind that project's "default" extra).
          pip install -r requirements.txt pyinstaller

      - name: Verify certifi is present for bundling
        run: python -c "import certifi, os; p = certifi.where(); assert os.path.exists(p), p; print('certifi OK:', p)"
      
      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Detect pre-release: matches patterns like 1.0.1b, 1.0.1b-hotfix, 1.0.1f-feature, 1.0.1-beta
          if [[ "$VERSION" =~ [0-9][bf](-|$) ]] || [[ "$VERSION" == *"-beta"* ]]; then
            echo "IS_BETA=true" >> $GITHUB_OUTPUT
          else
            echo "IS_BETA=false" >> $GITHUB_OUTPUT
          fi
          echo "RELEASE_NAME=FinFetcher v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate version resource
        run: python make_version_info.py version_info.txt

      # --noupx and the version resource each removed an antivirus detection on
      # VirusTotal. UPX is a packer, which engines score on regardless of what
      # is inside, and the runners have it on PATH so PyInstaller uses it unless
      # told not to.
      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --noupx --version-file version_info.txt --name "FinFetcher" --icon icon.ico --add-data "index.html;." --add-data "style.css;." --add-data "script.js;." --add-data "version.txt;." --add-data "icon.ico;." --clean --noconfirm main.pyw
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          body: |
            ## ${{ steps.version.outputs.RELEASE_NAME }}
            
            🦭 A video & music downloader.
            
            ### What's New
            - See commit history for changes
            
            ### Installation
            1. Download `FinFetcher.exe`
            2. Run the exe - Dependencies will be installed automatically on first launch
            3. Start downloading! 🎬🎵
          files: dist/FinFetcher.exe
          draft: false
          prerelease: ${{ steps.version.outputs.IS_BETA == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
