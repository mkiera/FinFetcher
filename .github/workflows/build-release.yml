name: Build and Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to package'
        required: true
        default: 'beta'
        type: string
      tag:
        description: 'Future release tag to validate and package without publishing'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend build dependencies
        run: npm ci

      - name: Prepare release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_BRANCH: ${{ inputs.ref || github.ref_name }}
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            node scripts/build-identity.mjs --tag "$env:RELEASE_TAG" --branch "$env:BUILD_BRANCH" --validate-placement
          } else {
            node scripts/build-identity.mjs --tag "$env:RELEASE_TAG" --branch "$env:BUILD_BRANCH"
          }

      - name: Run frontend and release tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Stage frontend assets
        run: npm run build:frontend

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            $globs = @("$([Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Verify installer migration and rollback
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1 -Compiler "$env:ISCC"
          ./scripts/test-uninstaller.ps1 -Compiler "$env:ISCC"

      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Prepared -SkipTests

      - name: Create Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          body_path: build/release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_BETA == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer
        if: github.event_name == 'push'
        run: gh release upload "${{ github.ref_name }}" "dist_installer/FinFetcher-Setup.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm installer asset
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $assets = gh release view "${{ github.ref_name }}" --json assets | ConvertFrom-Json
          $executables = @($assets.assets | Where-Object { $_.name.EndsWith('.exe') })
          if ($executables.Count -ne 1 -or $executables[0].name -ne 'FinFetcher-Setup.exe') { throw 'Release must contain only the FinFetcher installer executable.' }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save dry-run packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FinFetcher-Release-Validation
          path: |
            dist_installer/FinFetcher-Setup.exe
          if-no-files-found: error
          retention-days: 7
